name: Build Android Companion

# QA gate revision: 2026-09-11-a
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android unit tests
        run: gradle -p android testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle -p android lintDebug --stacktrace

      - name: Build debug APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: megas-story-companion-pilot-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
